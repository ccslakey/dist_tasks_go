# `docker compose up -d redis` starts just Redis (for tests and local runs).
# `docker compose up -d --build` starts the whole demo: Redis, three workers,
# a producer, Prometheus, Grafana, and Jaeger. See "Quick Start" in README.md
# and docs/DEMO.md.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  worker:
    build: .
    command: ["worker-demo", "-concurrency", "8", "-visibility", "5s"]
    environment:
      DTQ_REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    deploy:
      replicas: 3
    stop_grace_period: 10s
    depends_on: [redis]

  producer:
    build: .
    command: ["enqueue-demo", "-task", "mix", "-n", "0", "-delay", "20ms", "-latency", "400ms", "-metrics-addr", ":9100"]
    environment:
      DTQ_REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on: [redis]

  prometheus:
    image: prom/prometheus:v3.7.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dtq.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "${JAEGER_PORT:-16686}:16686"

volumes:
  redis-data:
